kind = "web"
previewPath = "/"
title = "QualityLab 360"
description = "Laboratorio interactivo de mejora continua para un módulo de 10 horas. Los participantes resuelven un caso real con 148 incidencias: diagnóstico, KPI, Pareto, Ishikawa, 5 porqués, Hoshin Kanri, control estadístico, auditoría, simulador e informe A3, con gamificación por equipos y panel para el facilitador."
version = "2.0.0"
id = "artifacts/qualitylab"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18778

[services.development]
run = "pnpm --filter @workspace/qualitylab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qualitylab", "run", "build" ]
serve = "static"
publicDir = "artifacts/qualitylab/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18778"
BASE_PATH = "/"
