openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

components:
  parameters:
    Codigo:
      name: codigo
      in: path
      required: true
      description: Código corto de la sesión
      schema:
        type: string
        minLength: 4
        maxLength: 12
    ParticipanteId:
      name: participanteId
      in: path
      required: true
      description: Identificador del participante
      schema:
        type: string
        format: uuid

  responses:
    SolicitudInvalida:
      description: La solicitud no cumple el contrato
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoEncontrado:
      description: No encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        mensaje:
          type: string
      required:
        - mensaje

    CrearSesion:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        facilitador:
          type: string
          maxLength: 120
      required:
        - nombre

    Sesion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
        nombre:
          type: string
        facilitador:
          type: string
          nullable: true
        activa:
          type: boolean
        creadaEn:
          type: string
          format: date-time
      required:
        - id
        - codigo
        - nombre
        - activa
        - creadaEn

    Unirse:
      type: object
      properties:
        dispositivoId:
          type: string
          minLength: 8
          maxLength: 64
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        equipoId:
          type: string
          minLength: 1
          maxLength: 60
      required:
        - dispositivoId
        - nombre
        - equipoId

    Participante:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sesionId:
          type: string
          format: uuid
        nombre:
          type: string
        equipoId:
          type: string
        creadoEn:
          type: string
          format: date-time
      required:
        - id
        - sesionId
        - nombre
        - equipoId
        - creadoEn

    Inscripcion:
      type: object
      properties:
        sesion:
          $ref: "#/components/schemas/Sesion"
        participante:
          $ref: "#/components/schemas/Participante"
        avance:
          oneOf:
            - $ref: "#/components/schemas/Avance"
            - type: "null"
          description: Avance previo del participante, o null si es su primera vez.
      required:
        - sesion
        - participante

    RespuestaEjercicio:
      type: object
      properties:
        preguntaId:
          type: string
        opcionId:
          type: string
        correcta:
          type: boolean
      required:
        - preguntaId
        - opcionId
        - correcta

    GuardarAvance:
      type: object
      properties:
        puntos:
          type: integer
          minimum: 0
        misiones:
          type: array
          items:
            type: string
        logros:
          type: array
          items:
            type: string
        respuestas:
          type: array
          items:
            $ref: "#/components/schemas/RespuestaEjercicio"
        estado:
          type: object
          additionalProperties: true
          description: Estado completo del cliente, para restaurarlo en otro dispositivo.
        casoId:
          type: string
          maxLength: 60
          description: >-
            Caso sobre el que trabaja el participante. Permite que el avance de
            la sesión se refleje también en la revisión por grupo del
            facilitador. Opcional para no romper clientes anteriores.
      required:
        - puntos
        - misiones
        - logros
        - respuestas
        - estado

    Avance:
      type: object
      properties:
        participanteId:
          type: string
          format: uuid
        puntos:
          type: integer
        misiones:
          type: array
          items:
            type: string
        logros:
          type: array
          items:
            type: string
        respondidas:
          type: integer
        aciertos:
          type: integer
        estado:
          type: object
          additionalProperties: true
        actualizadoEn:
          type: string
          format: date-time
      required:
        - participanteId
        - puntos
        - misiones
        - logros
        - respondidas
        - aciertos
        - estado
        - actualizadoEn

    FilaTablero:
      type: object
      properties:
        participanteId:
          type: string
          format: uuid
        nombre:
          type: string
        equipoId:
          type: string
        puntos:
          type: integer
        misiones:
          type: array
          items:
            type: string
        logros:
          type: array
          items:
            type: string
        respondidas:
          type: integer
        aciertos:
          type: integer
        vistoEn:
          type: string
          format: date-time
      required:
        - participanteId
        - nombre
        - equipoId
        - puntos
        - misiones
        - logros
        - respondidas
        - aciertos
        - vistoEn

    EstadisticaPregunta:
      type: object
      properties:
        preguntaId:
          type: string
        respondidas:
          type: integer
        correctas:
          type: integer
        opciones:
          type: object
          additionalProperties:
            type: integer
          description: Conteo de participantes por opción elegida.
      required:
        - preguntaId
        - respondidas
        - correctas
        - opciones

    ResumenTablero:
      type: object
      properties:
        participantes:
          type: integer
        activosUltimos5Min:
          type: integer
        puntosPromedio:
          type: number
        misionesCompletadas:
          type: integer
      required:
        - participantes
        - activosUltimos5Min
        - puntosPromedio
        - misionesCompletadas

    Tablero:
      type: object
      properties:
        sesion:
          $ref: "#/components/schemas/Sesion"
        resumen:
          $ref: "#/components/schemas/ResumenTablero"
        filas:
          type: array
          items:
            $ref: "#/components/schemas/FilaTablero"
        preguntas:
          type: array
          items:
            $ref: "#/components/schemas/EstadisticaPregunta"
      required:
        - sesion
        - resumen
        - filas
        - preguntas
